name: ${COMPOSE_PROJECT_NAME:-backend_daily_production}

x-app-common: &app-common
  image: ${APP_IMAGE:-backend-daily-production:local}
  build:
    context: .
  restart: unless-stopped
  env_file:
    - .env
  depends_on:
    mongodb:
      condition: service_healthy

services:
  app:
    <<: *app-common
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8011}:8000"

  app_blue:
    <<: *app-common
    profiles: ["bluegreen"]
    ports:
      - "127.0.0.1:${APP_BLUE_HOST_PORT:-8011}:8000"

  app_green:
    <<: *app-common
    profiles: ["bluegreen"]
    ports:
      - "127.0.0.1:${APP_GREEN_HOST_PORT:-8013}:8000"

  mongodb:
    image: mongo:7
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27030}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'try {
            rs.status();
          } catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro

volumes:
  mongo_data:
